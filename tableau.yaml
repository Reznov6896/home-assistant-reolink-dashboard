# =============================================================================
#  Tableau de bord : la vue « Sécurité » et la vue caméra plein écran
# =============================================================================
#  Deux vues à placer sous `views:` d'un tableau en mode YAML.
#  `/lovelace/...` : remplacer `lovelace` par l'adresse de votre tableau.
#  La carte `custom:parler-camera` exige la ressource /local/parler-camera.js
#  (type module) et l'intégration WebRTC.
#  Les noms d'entités suivent ceux de l'intégration Reolink en français pour
#  une caméra nommée « Caméra salon » : « Fluide » = sous-flux, « Net » = flux
#  principal.
# =============================================================================
  - title: Sécurité
    path: securite
    icon: mdi:shield-home
    type: sections
    max_columns: 3
    sections:
      # ------------------------------------------- BANDEAU : LE DIRECT
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Caméra du salon
            icon: mdi:cctv
          - type: picture-glance
            title: Salon
            camera_image: camera.camera_salon_fluide
            camera_view: live
            grid_options:
              columns: full
            tap_action:
              action: navigate
              navigation_path: /lovelace/camera-plein-ecran
            hold_action:
              action: more-info
            entities:
              - entity: switch.camera_salon_mode_prive
                name: Mode privé
              - entity: binary_sensor.camera_salon_personne
                name: Personne
              - entity: binary_sensor.camera_salon_mouvement
                name: Mouvement
          - type: button
            grid_options:
              columns: 12
              rows: 2
            name: Plein écran (direct)
            icon: mdi:fullscreen
            show_state: false
            tap_action:
              action: navigate
              navigation_path: /lovelace/camera-plein-ecran
          - type: tile
            grid_options:
              columns: 12
              rows: 2
            entity: switch.camera_salon_mode_prive
            name: Mode privé (caméra off)
            icon: mdi:eye-off
          # Le mode jour/nuit : auto (la caméra décide) · color (couleur
          # forcée) · blackwhite (noir et blanc forcé).
          - type: tile
            grid_options:
              columns: 12
              rows: 2
            entity: select.camera_salon_mode_jour_nuit
            name: Image — auto / couleur / noir et blanc
            icon: mdi:theme-light-dark
          - type: tile
            grid_options:
              columns: 12
              rows: 2
            entity: sensor.camera_salon_etat_jour_nuit
            name: État réel de l'image
            icon: mdi:weather-night
          - type: tile
            grid_options:
              columns: 12
              rows: 2
            entity: switch.camera_salon_lumieres_infrarouges_en_mode_nuit
            name: Infrarouge la nuit
            icon: mdi:led-on
          - type: tile
            grid_options:
              columns: 12
              rows: 2
            entity: light.camera_salon_led_d_etat
            name: LED d'état de la caméra
            icon: mdi:led-outline

      # ------------------------------------------- COLONNE : DÉTECTION
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Détection
            icon: mdi:motion-sensor
          - type: tile
            entity: binary_sensor.porte_entree
            name: Porte d'entrée
            icon: mdi:door
          - type: tile
            entity: binary_sensor.camera_salon_personne
            name: Personne détectée
          - type: tile
            entity: binary_sensor.camera_salon_mouvement
            name: Mouvement
          - type: tile
            entity: binary_sensor.camera_salon_animal
            name: Animal
          - type: heading
            heading: Sensibilité
            icon: mdi:tune-vertical
          - type: tile
            entity: number.camera_salon_sensibilite_mouvement
            name: Mouvement
          - type: tile
            entity: number.camera_salon_sensibilite_personne_ia
            name: Personne (IA)
          - type: tile
            entity: number.camera_salon_sensibilite_animal_ia
            name: Animal (IA)
          - type: heading
            heading: Présence
            icon: mdi:account-group
          - type: tile
            entity: person.personne_a
            name: Personne A
          - type: tile
            entity: person.personne_b
            name: Personne B
          - type: heading
            heading: Automatisations sécurité
            icon: mdi:robot
          - type: tile
            entity: automation.securite_mode_prive_de_la_camera_presence_porte
            name: Mode privé (présence + porte)
          - type: tile
            entity: automation.securite_alerte_intrusion
            name: Alerte intrusion (photos + vidéo)

      # ------------------------------------------- COLONNE : ALARME
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Alarme
            icon: mdi:bullhorn
          - type: button
            entity: siren.camera_salon_sirene
            name: Déclencher la sirène
            icon: mdi:bullhorn
            show_state: true
            grid_options:
              columns: full
            tap_action:
              action: perform-action
              perform_action: siren.turn_on
              target:
                entity_id: siren.camera_salon_sirene
              confirmation:
                text: "Déclencher la sirène de la caméra ?"
          - type: button
            name: Arrêter la sirène
            icon: mdi:volume-off
            show_state: false
            grid_options:
              columns: full
            tap_action:
              action: perform-action
              perform_action: siren.turn_off
              target:
                entity_id: siren.camera_salon_sirene
          - type: tile
            entity: number.camera_salon_volume
            name: Volume de la sirène
            icon: mdi:volume-high
            grid_options:
              columns: full
          - type: tile
            entity: switch.camera_salon_sirene_lors_de_l_evenement
            name: Sirène automatique sur détection
            grid_options:
              columns: full

  # ============================ CAMÉRA PLEIN ÉCRAN ============================
  # Le micro ne passe PAS par l'intégration Reolink (pas d'audio bidirectionnel) :
  # la carte parle au flux de go2rtc qui porte la voie retour de la caméra.
  # Le micro est négocié MUET puis démuté le temps de l'appui, et TOUS les
  # chemins de sortie le referment (relâcher, sortir du bouton, changer
  # d'onglet, quitter la page).
  # ⚠️ Il exige un contexte SÉCURISÉ côté navigateur (HTTPS) ; sinon la carte
  #    l'ÉCRIT à l'écran au lieu d'échouer en silence.
  - title: Caméra plein écran
    path: camera-plein-ecran
    icon: mdi:fullscreen
    subview: true
    type: panel
    cards:
      - type: custom:parler-camera
        url: camera_micro
