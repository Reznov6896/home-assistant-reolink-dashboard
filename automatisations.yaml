# =============================================================================
#  Une caméra armée par la présence : les cinq automatisations
# =============================================================================
#  À coller dans `automations.yaml` (elles restent modifiables dans
#  l'interface). Elles s'appuient sur les capteurs de `gabarits.yaml`.
#  Entités génériques : voir le tableau « À adapter » du README.
#
#  Vocabulaire :
#    armer    = COUPER le mode privé (la caméra filme et détecte) ;
#    désarmer = ACTIVER le mode privé (flux et détection coupés).
#
#  Les règles communes :
#    - désarmer ne demande aucune preuve ; armer en demande toujours une ;
#    - toute branche qui arme exige `binary_sensor.presence_mesurable` = on :
#      dans le doute, on n'arme pas ;
#    - armer sur la foi du routeur exige en plus une preuve de départ : la porte.
#
#  Les messages partent par l'intégration Telegram de Home Assistant, vers la
#  discussion par défaut du bot.
# =============================================================================

# -----------------------------------------------------------------------------
# 1. Le mode privé suit la présence et la porte
# -----------------------------------------------------------------------------
- id: camera_mode_prive_presence_porte
  alias: Sécurité - Mode privé de la caméra (présence + porte)
  description: >-
    Arrivée : mode privé. Départ de tout le foyer : caméra armée. Porte ouverte
    alors que personne n'est confirmé : caméra réveillée, 45 s de grâce, puis
    message si personne n'est rentré.
  triggers:
    - id: porte
      trigger: state
      entity_id: binary_sensor.porte_entree
      to: "on"
    # 4 min : on n'arme pas sur une absence de quelques instants.
    - id: depart
      trigger: state
      entity_id:
        - person.personne_a
        - person.personne_b
      to: not_home
      for:
        minutes: 4
    - id: arrivee
      trigger: state
      entity_id:
        - person.personne_a
        - person.personne_b
      to: home
  conditions: []
  actions:
    - choose:
        # Arrivée : on désarme tout de suite, sans autre preuve.
        - conditions:
            - condition: trigger
              id: arrivee
          sequence:
            - action: switch.turn_on
              target:
                entity_id: switch.camera_salon_mode_prive

        # Départ : on n'arme que si la présence est mesurable ET que plus
        # personne n'est à la maison.
        - conditions:
            - condition: trigger
              id: depart
            - condition: state
              entity_id: binary_sensor.presence_mesurable
              state: "on"
            - condition: template
              value_template: >-
                {{ not (is_state('person.personne_a', 'home')
                        or is_state('person.personne_b', 'home')) }}
          sequence:
            - action: switch.turn_off
              target:
                entity_id: switch.camera_salon_mode_prive

        # Porte ouverte, quelqu'un est là : on reste (ou on repasse) en privé.
        - conditions:
            - condition: trigger
              id: porte
            - condition: template
              value_template: >-
                {{ is_state('person.personne_a', 'home')
                   or is_state('person.personne_b', 'home') }}
          sequence:
            - action: switch.turn_on
              target:
                entity_id: switch.camera_salon_mode_prive

        # Porte ouverte, personne n'est confirmé : on réveille la caméra, puis
        # 45 s de grâce. En rentrant, la porte s'ouvre quelques secondes AVANT
        # que le téléphone ne retrouve le Wi-Fi.
        - conditions:
            - condition: trigger
              id: porte
            - condition: state
              entity_id: binary_sensor.presence_mesurable
              state: "on"
            - condition: template
              value_template: >-
                {{ not (is_state('person.personne_a', 'home')
                        or is_state('person.personne_b', 'home')) }}
          sequence:
            - action: switch.turn_off
              target:
                entity_id: switch.camera_salon_mode_prive
            - wait_template: >-
                {{ is_state('person.personne_a', 'home')
                   or is_state('person.personne_b', 'home') }}
              timeout:
                seconds: 45
              continue_on_timeout: true
            - choose:
                # Quelqu'un est rentré : retour en privé, sans message.
                # Cette remise en privé est INDISPENSABLE ici : en mode
                # `single`, le déclencheur « arrivee » survenu pendant
                # l'attente est ignoré.
                - conditions:
                    - condition: template
                      value_template: >-
                        {{ is_state('person.personne_a', 'home')
                           or is_state('person.personne_b', 'home') }}
                  sequence:
                    - action: switch.turn_on
                      target:
                        entity_id: switch.camera_salon_mode_prive
              default:
                - action: telegram_bot.send_message
                  data:
                    message: >-
                      ⚠️ ALERTE : la porte d'entrée vient de s'ouvrir et
                      personne n'est confirmé à la maison ! La caméra a été
                      réactivée.
  mode: single

# -----------------------------------------------------------------------------
# 2. L'alerte intrusion, en deux temps : le texte, puis les images
# -----------------------------------------------------------------------------
#  Son entity_id (`automation.securite_alerte_intrusion`) est surveillé par
#  l'automatisation 5 : le vérifier après l'import, il dépend de l'alias.
- id: camera_alerte_intrusion
  alias: Sécurité - Alerte intrusion
  description: >-
    Une personne détectée par la caméra alors que personne n'est confirmé à la
    maison : 45 s de grâce, puis le texte de l'alerte SEUL, puis 3 photos, puis
    120 s de vidéo enregistrées sur le serveur.
  triggers:
    - trigger: state
      entity_id: binary_sensor.camera_salon_personne
      to: "on"
  conditions:
    - condition: state
      entity_id: binary_sensor.presence_mesurable
      state: "on"
    - condition: template
      value_template: >-
        {{ not (is_state('person.personne_a', 'home')
                or is_state('person.personne_b', 'home')) }}
  actions:
    # Même grâce que pour la porte : la personne qui rentre n'est pas filmée.
    - wait_template: >-
        {{ is_state('person.personne_a', 'home')
           or is_state('person.personne_b', 'home') }}
      timeout:
        seconds: 45
      continue_on_timeout: true
    - condition: template
      value_template: >-
        {{ not (is_state('person.personne_a', 'home')
                or is_state('person.personne_b', 'home')) }}
    - variables:
        ts: "{{ now().strftime('%Y%m%d_%H%M%S') }}"
    # 1er temps : le texte part SEUL. Quand il voyageait dans la légende de la
    # 1re photo, il disparaissait avec elle si la photo n'était pas écrite à temps.
    - action: telegram_bot.send_message
      continue_on_error: true
      data:
        parse_mode: plain_text
        message: >-
          ⚠️ ALERTE INTRUSION : une personne a été détectée à la maison et
          personne n'y est confirmé. Photos et enregistrement vidéo en cours...
    # 2e temps : 3 photos, une toutes les 15 s environ.
    - repeat:
        count: 3
        sequence:
          - variables:
              photo_ts: "{{ now().strftime('%Y%m%d_%H%M%S') }}"
          - action: camera.snapshot
            continue_on_error: true
            target:
              entity_id: camera.camera_salon_instantanes_net
            data:
              filename: /media/camera/photo_{{ photo_ts }}.jpg
          - delay:
              seconds: 1
          - action: telegram_bot.send_photo
            continue_on_error: true
            data:
              file: /media/camera/photo_{{ photo_ts }}.jpg
              caption: "📸 Photo {{ repeat.index }}/3 - intrusion"
          - delay:
              seconds: 14
    # Puis 120 s de vidéo sur le flux principal. `camera.record` BLOQUE
    # jusqu'à la fin : il passe en dernier, et l'automatisation 5 le surveille.
    - action: camera.record
      continue_on_error: true
      target:
        entity_id: camera.camera_salon_net
      data:
        filename: /media/camera/video_{{ ts }}.mp4
        duration: 120
  # single : une intrusion, un enregistrement complet. En `restart`, chaque
  # nouvelle détection relancerait la grâce et couperait la vidéo.
  mode: single
  max_exceeded: silent

# -----------------------------------------------------------------------------
# 3. Présence aveugle : un voyant plutôt qu'un armement à tort
# -----------------------------------------------------------------------------
- id: camera_presence_aveugle
  alias: Sécurité - Présence aveugle (la caméra ne s'arme plus)
  description: >-
    Prévient quand Home Assistant ne peut plus savoir qui est à la maison.
    Dans cet état, les automatisations refusent d'armer la caméra plutôt que
    de décider sur du vide.
  triggers:
    - id: aveugle
      trigger: state
      entity_id: binary_sensor.presence_mesurable
      to: "off"
      for:
        minutes: 5
    - id: retablie
      trigger: state
      entity_id: binary_sensor.presence_mesurable
      to: "on"
      for:
        minutes: 1
  conditions: []
  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: aveugle
          sequence:
            - action: telegram_bot.send_message
              data:
                parse_mode: html
                message: >-
                  🟠 Présence AVEUGLE depuis 5 min : Home Assistant ne sait
                  plus qui est à la maison. Détail : {{
                  state_attr('binary_sensor.presence_mesurable', 'detail') }}.
                  La caméra ne s'armera pas tant que ce n'est pas réparé (c'est
                  voulu : mieux vaut ne pas décider que décider sur du vide).
                  Cause la plus probable : l'intégration du routeur ne s'est
                  pas chargée.
        - conditions:
            - condition: trigger
              id: retablie
          sequence:
            - action: telegram_bot.send_message
              data:
                parse_mode: html
                message: >-
                  🟢 Présence rétablie. La caméra retrouve son comportement
                  normal.
  mode: single

# -----------------------------------------------------------------------------
# 4. Le filet du routeur : le logement est vide et `person` ne l'a pas vu
# -----------------------------------------------------------------------------
#  Né d'un trou de 3 h 10 : le routeur avait vu les téléphones partir, mais
#  la personne restait « à la maison » sur la foi d'un GPS muet.
#  STRICTEMENT ADDITIF : il peut armer PLUS TÔT, il ne désarme jamais rien.
#  45 min = trois fois la plus longue coupure du routeur mesurée chez des
#  occupants présents (15 min).
#  La nuit, le routeur perd des téléphones en veille pendant des heures, et un
#  GPS immobile n'émet rien : la 1re version a armé la caméra quatre nuits,
#  logement occupé. D'où la PREUVE DE DÉPART exigée : la porte s'ouvre, PUIS
#  les téléphones disparaissent (ouverture entre 60 min avant et 2 min après).
#  Rejoué sur l'historique : les 4 nuits fausses sont écartées, les 3 vrais
#  départs de la même période restent armés.
#  Essayé puis retiré : demander leur position aux téléphones
#  (`request_location_update`). Rien n'est revenu en 90 s : un veto mort.
- id: camera_filet_routeur
  alias: Sécurité - Filet routeur (le logement est vide et person.* ne l'a pas vu)
  description: >-
    Le routeur ne voit plus aucun téléphone depuis 45 min, aucun GPS récent ne
    dit « à la maison », et la porte s'est ouverte juste avant : la caméra est
    armée et les lampes éteintes. Il ne parle que s'il a vraiment rattrapé
    quelque chose.
  triggers:
    - trigger: state
      entity_id: binary_sensor.logement_vide_selon_le_routeur
      to: "on"
      for:
        minutes: 45
  conditions:
    - condition: state
      entity_id: binary_sensor.presence_mesurable
      state: "on"
    # Aucun GPS FRAIS (moins de 45 min = 2700 s) ne dit « à la maison ».
    - condition: template
      value_template: >-
        {{ not ((is_state('device_tracker.telephone_a_gps', 'home')
                 and (now() - states.device_tracker.telephone_a_gps.last_updated).total_seconds() < 2700)
                or (is_state('device_tracker.telephone_b_gps', 'home')
                    and (now() - states.device_tracker.telephone_b_gps.last_updated).total_seconds() < 2700)) }}
    # La preuve de départ : une ouverture de porte entre 60 min avant et
    # 2 min après le moment où le routeur a perdu les téléphones.
    - condition: template
      value_template: >-
        {% set porte = as_timestamp(states('sensor.derniere_ouverture_porte'), 0) %}
        {% set vide = as_timestamp(states.binary_sensor.logement_vide_selon_le_routeur.last_changed, 0) %}
        {{ vide - 3600 <= porte <= vide + 120 }}
  actions:
    # Il n'agit, et ne parle, que si la caméra était encore en privé.
    - if:
        - condition: state
          entity_id: switch.camera_salon_mode_prive
          state: "on"
      then:
        - action: switch.turn_off
          target:
            entity_id: switch.camera_salon_mode_prive
        - action: telegram_bot.send_message
          continue_on_error: true
          data:
            parse_mode: plain_text
            message: >-
              🛡️ Filet routeur : le logement est vide depuis 45 min selon le
              routeur, mais Home Assistant croyait encore quelqu'un à la maison.
              La caméra vient d'être ARMÉE et les lampes éteintes (la porte
              s'est ouverte juste avant que les téléphones ne disparaissent).
              Détail : {{ state_attr('binary_sensor.logement_vide_selon_le_routeur', 'detail') }}
        # Les lampes ne s'éteignent QUE s'il arme vraiment.
        - action: light.turn_off
          target:
            entity_id: light.toutes_les_lampes
  mode: single

# -----------------------------------------------------------------------------
# 5. L'alerte intrusion ne doit pas rester bloquée en silence
# -----------------------------------------------------------------------------
#  L'alerte est en mode `single` : si `camera.record` se fige, elle reste
#  « en cours » et plus AUCUNE intrusion n'est signalée, sans voyant.
#  Une exécution normale dure ~3 min (45 s + photos + 120 s de vidéo).
#  Au-delà de 10 min, elle est figée : arrêt (qui annule l'exécution bloquée),
#  remise en marche, et un message. Vaut aussi si elle devient indisponible.
#  Lancée à la main, elle sert d'essai : le message le précise.
- id: camera_alerte_intrusion_bloquee
  alias: Surveillance - Alerte intrusion bloquée
  description: >-
    Relance l'alerte intrusion si elle reste en cours plus de 10 min, ou si
    elle devient indisponible, et prévient.
  triggers:
    - trigger: template
      value_template: >-
        {{ states('automation.securite_alerte_intrusion') in ['unavailable', 'unknown']
           or (state_attr('automation.securite_alerte_intrusion', 'current') | int(0)) > 0 }}
      for:
        minutes: 10
  conditions: []
  actions:
    - variables:
        essai: "{{ trigger.platform != 'template' }}"
        etat_avant: "{{ states('automation.securite_alerte_intrusion') }}"
    - action: automation.turn_off
      continue_on_error: true
      target:
        entity_id: automation.securite_alerte_intrusion
      data:
        stop_actions: true
    - delay:
        seconds: 2
    - action: automation.turn_on
      continue_on_error: true
      target:
        entity_id: automation.securite_alerte_intrusion
    - delay:
        seconds: 2
    - action: telegram_bot.send_message
      data:
        message: >-
          {{ '(ESSAI manuel, rien de bloqué) ' if essai else '' }}⚠️ Alerte intrusion :
          {% if etat_avant in ['unavailable', 'unknown'] %}l'automatisation est INDISPONIBLE
          depuis 10 min : plus aucune intrusion ne serait signalée.{% else %}elle était
          BLOQUÉE en cours depuis 10 min (enregistrement vidéo figé ?) : plus aucune
          intrusion n'aurait été signalée. Relancée automatiquement.{% endif %} État
          maintenant : {{ states('automation.securite_alerte_intrusion') }}.
  mode: single
