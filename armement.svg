<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 750" width="880" height="750" role="img" aria-labelledby="titre desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="titre">L'armement de la caméra : trois états et les preuves exigées pour passer de l'un à l'autre</title>
  <desc id="desc">Armer veut dire couper le mode privé. Trois états. PRIVÉE : mode privé activé, la caméra ne filme et ne détecte rien. ARMÉE : mode privé coupé, elle filme et détecte les personnes. GRÂCE 45 secondes : la porte s'est ouverte alors que personne n'est confirmé à la maison, la caméra est réveillée et attend qu'une personne soit confirmée. De PRIVÉE vers ARMÉE, deux chemins, chacun soumis à la garde « présence mesurable » : 1, le départ, tout le foyer absent depuis 4 minutes ; 2, le filet du routeur, logement vide depuis 45 minutes selon le routeur, aucun GPS récent à la maison, et la porte ouverte juste avant. D'ARMÉE vers PRIVÉE : l'arrivée d'une personne, tout de suite, sans autre preuve. D'ARMÉE vers GRÂCE : la porte s'ouvre alors que personne n'est confirmé. De GRÂCE vers PRIVÉE : une personne est confirmée avant 45 secondes, sans alerte. De GRÂCE vers ARMÉE : 45 secondes sans personne, la caméra reste armée et un message part. Si la présence n'est pas mesurable, rien ne s'arme et un message « présence aveugle » part après 5 minutes. Pendant ARMÉE, l'alerte intrusion : une personne détectée par la caméra, 45 secondes de grâce, le texte de l'alerte part seul, puis 3 photos et 120 secondes de vidéo. Si elle reste bloquée plus de 10 minutes, une autre automatisation la relance et le signale.</desc>
  <style>
    .surface { fill: #fcfcfb; }
    .t1 { fill: #0b0b0b; }
    .t2 { fill: #52514e; }
    .acc { fill: #186b62; }
    .b1 { fill: none; stroke: #3d3c39; stroke-width: 1.4; }
    .garde { fill: none; stroke: #186b62; stroke-width: 1.4; stroke-dasharray: 5 4; }
    .fl { stroke: #52514e; stroke-width: 1.6; fill: none; }
    .pointe { fill: #52514e; }
    .arme-trait { stroke: #eb6834; stroke-width: 2; fill: none; }
    .arme-texte { fill: #b5441a; }
    .arme-pointe { fill: #eb6834; }
    .prive-trait { stroke: #2a78d6; stroke-width: 2; fill: none; }
    .prive-texte { fill: #1f62b3; }
    .prive-pointe { fill: #2a78d6; }
    .mono { font-family: ui-monospace, 'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace; }
    @media (prefers-color-scheme: dark) {
      .surface { fill: #1a1a19; }
      .t1 { fill: #ffffff; }
      .t2 { fill: #c3c2b7; }
      .acc { fill: #4fb3a5; }
      .b1 { stroke: #c3c2b7; }
      .garde { stroke: #4fb3a5; }
      .fl { stroke: #c3c2b7; }
      .pointe { fill: #c3c2b7; }
      .arme-trait { stroke: #d95926; }
      .arme-texte { fill: #f2905f; }
      .arme-pointe { fill: #d95926; }
      .prive-trait { stroke: #3987e5; }
      .prive-texte { fill: #7fb2f0; }
      .prive-pointe { fill: #3987e5; }
    }
  </style>
  <defs>
    <marker id="pn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="pointe" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="pa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="arme-pointe" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="pp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="prive-pointe" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <rect class="surface" x="0" y="0" width="880" height="750" rx="8"/>

  <text class="t1" x="28" y="38" font-size="18" font-weight="600">L'armement de la caméra</text>
  <text class="t2" x="28" y="60" font-size="12.5">Armer = couper le mode privé. Désarmer ne demande aucune preuve ; armer en demande toujours une.</text>

  <!-- La garde, commune à toutes les flèches qui arment -->
  <rect class="garde" x="28" y="78" width="824" height="58" rx="4"/>
  <text class="t1" x="44" y="101" font-size="12.5" font-weight="600">Garde sur chaque flèche orange : la présence doit être mesurable.</text>
  <text class="t2" x="44" y="122" font-size="12">Chaque personne dans un état connu. Sinon rien ne s'arme, et un message « présence aveugle » part après 5 min.</text>

  <!-- Les deux états principaux -->
  <rect class="prive-trait" x="40" y="168" width="200" height="190" rx="6"/>
  <g text-anchor="middle">
    <text class="prive-texte mono" x="140" y="236" font-size="15" font-weight="700">PRIVÉE</text>
    <text class="t1" x="140" y="264" font-size="12">mode privé activé</text>
    <text class="t2" x="140" y="284" font-size="12">la caméra ne filme</text>
    <text class="t2" x="140" y="300" font-size="12">et ne détecte rien</text>
  </g>

  <rect class="arme-trait" x="640" y="168" width="200" height="190" rx="6"/>
  <g text-anchor="middle">
    <text class="arme-texte mono" x="740" y="236" font-size="15" font-weight="700">ARMÉE</text>
    <text class="t1" x="740" y="264" font-size="12">mode privé coupé</text>
    <text class="t2" x="740" y="284" font-size="12">elle filme et détecte</text>
    <text class="t2" x="740" y="300" font-size="12">les personnes</text>
  </g>

  <!-- 1 · Départ -->
  <text class="arme-texte" x="440" y="196" font-size="12" font-weight="600" text-anchor="middle">1 · Départ : tout le foyer « absent » depuis 4 min</text>
  <line class="arme-trait" x1="242" y1="210" x2="636" y2="210" marker-end="url(#pa)"/>

  <!-- 2 · Filet du routeur -->
  <text class="arme-texte" x="440" y="240" font-size="12" font-weight="600" text-anchor="middle">2 · Filet du routeur : logement vide depuis 45 min,</text>
  <text class="t2" x="440" y="256" font-size="12" text-anchor="middle">aucun GPS récent à la maison, porte ouverte juste avant</text>
  <line class="arme-trait" x1="242" y1="270" x2="636" y2="270" marker-end="url(#pa)"/>

  <!-- Arrivée -->
  <text class="prive-texte" x="440" y="304" font-size="12" font-weight="600" text-anchor="middle">Arrivée d'une personne : retour en privé,</text>
  <text class="t2" x="440" y="320" font-size="12" text-anchor="middle">tout de suite, sans autre preuve</text>
  <line class="prive-trait" x1="638" y1="334" x2="244" y2="334" marker-end="url(#pp)"/>

  <!-- La grâce -->
  <rect class="b1" x="640" y="440" width="200" height="110" rx="6"/>
  <g text-anchor="middle">
    <text class="acc mono" x="740" y="470" font-size="14" font-weight="700">GRÂCE 45 s</text>
    <text class="t1" x="740" y="494" font-size="12">la caméra est réveillée,</text>
    <text class="t2" x="740" y="512" font-size="12">on attend qu'une personne</text>
    <text class="t2" x="740" y="528" font-size="12">soit confirmée à la maison</text>
  </g>

  <!-- Armée -> Grâce : la porte -->
  <line class="fl" x1="700" y1="360" x2="700" y2="436" marker-end="url(#pn)"/>
  <text class="t1" x="690" y="394" font-size="12" text-anchor="end">Porte ouverte,</text>
  <text class="t2" x="690" y="410" font-size="12" text-anchor="end">personne n'est confirmé</text>

  <!-- Grâce -> Armée : 45 s écoulées -->
  <line class="arme-trait" x1="790" y1="438" x2="790" y2="362" marker-end="url(#pa)"/>
  <text class="arme-texte" x="798" y="404" font-size="12" font-weight="600">45 s</text>
  <text class="t2" x="840" y="574" font-size="12" text-anchor="end">Au bout de 45 s sans personne : elle reste armée, et un message part.</text>

  <!-- Grâce -> Privée : quelqu'un est confirmé -->
  <path class="prive-trait" d="M638 496 L140 496 L140 362" marker-end="url(#pp)"/>
  <text class="prive-texte" x="390" y="486" font-size="12" font-weight="600" text-anchor="middle">Une personne est confirmée avant 45 s : retour en privé, sans alerte</text>

  <!-- L'alerte intrusion -->
  <text class="acc mono" x="40" y="622" font-size="12.5" font-weight="700">Pendant ARMÉE : l'alerte intrusion, en deux temps</text>
  <g text-anchor="middle" font-size="11.5">
    <rect class="b1" x="40" y="636" width="176" height="60" rx="3"/>
    <text class="t1" x="128" y="661">Personne détectée</text>
    <text class="t2" x="128" y="679">par la caméra (garde)</text>

    <rect class="b1" x="252" y="636" width="176" height="60" rx="3"/>
    <text class="t1" x="340" y="661">45 s de grâce :</text>
    <text class="t2" x="340" y="679">quelqu'un rentre ? fin</text>

    <rect class="b1" x="464" y="636" width="176" height="60" rx="3"/>
    <text class="t1" x="552" y="661">le texte de l'alerte</text>
    <text class="t2" x="552" y="679">part seul, d'abord</text>

    <rect class="b1" x="676" y="636" width="176" height="60" rx="3"/>
    <text class="t1" x="764" y="661">3 photos, puis</text>
    <text class="t2" x="764" y="679">120 s de vidéo</text>
  </g>
  <line class="fl" x1="218" y1="666" x2="248" y2="666" marker-end="url(#pn)"/>
  <line class="fl" x1="430" y1="666" x2="460" y2="666" marker-end="url(#pn)"/>
  <line class="fl" x1="642" y1="666" x2="672" y2="666" marker-end="url(#pn)"/>
  <text class="t2" x="40" y="726" font-size="11.5">Bloquée plus de 10 min (vidéo figée) : une autre automatisation la relance, et un message le dit.</text>
</svg>
