camera_take_snapshot:
  alias: Camera - take snapshot
  icon: mdi:camera
  mode: single
  max_exceeded: silent
  variables:
    was_private: "{{ is_state('switch.living_room_privacy_mode', 'on') }}"
    file: "/media/reolink/photo_{{ now().strftime('%Y%m%d_%H%M%S') }}.jpg"
  sequence:
  - if: "{{ was_private }}"
    then:
    - action: switch.turn_off
      target:
        entity_id: switch.living_room_privacy_mode
    - wait_template: "{{ states('camera.living_room_snapshots_clear') not in ['unavailable', 'unknown'] }}"
      timeout:
        seconds: 45
    - delay:
        seconds: 10
  - action: camera.snapshot
    continue_on_error: true
    target:
      entity_id: camera.living_room_snapshots_clear
    data:
      filename: "{{ file }}"
  - if: "{{ was_private }}"
    then:
    - action: switch.turn_on
      target:
        entity_id: switch.living_room_privacy_mode
  - action: persistent_notification.create
    data:
      title: Camera
      message: "Snapshot saved: {{ file }}"
camera_record_clip:
  alias: Camera - record 2 minutes
  icon: mdi:record-rec
  mode: single
  max_exceeded: silent
  variables:
    was_private: "{{ is_state('switch.living_room_privacy_mode', 'on') }}"
    file: "/media/reolink/video_{{ now().strftime('%Y%m%d_%H%M%S') }}.mp4"
  sequence:
  - if: "{{ was_private }}"
    then:
    - action: switch.turn_off
      target:
        entity_id: switch.living_room_privacy_mode
    - wait_template: "{{ states('camera.living_room_clear') not in ['unavailable', 'unknown'] }}"
      timeout:
        seconds: 60
    - delay:
        seconds: 25
  - action: camera.record
    continue_on_error: true
    target:
      entity_id: camera.living_room_clear
    data:
      filename: "{{ file }}"
      duration: 120
  - if: "{{ was_private }}"
    then:
    - action: switch.turn_on
      target:
        entity_id: switch.living_room_privacy_mode
  - action: persistent_notification.create
    data:
      title: Camera
      message: "Clip saved: {{ file }}"
