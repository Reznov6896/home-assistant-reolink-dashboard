# Camera dashboard scripts, to add to scripts.yaml.
# camera_ptz_*: 250 ms pulse then Stop (the integration's PTZ buttons start a CONTINUOUS move).
# camera_take_snapshot / camera_record_clip: manual capture; if privacy mode is on, it is lifted for the
#   capture and restored. Files go to /media/reolink (add it to allowlist_external_dirs).
camera_ptz_up:
  alias: Camera - PTZ pulse up
  icon: mdi:arrow-up-bold
  mode: single
  max_exceeded: silent
  sequence:
  - action: button.press
    target:
      entity_id: button.living_room_ptz_up
  - delay:
      milliseconds: 250
  - action: button.press
    target:
      entity_id: button.living_room_ptz_stop
camera_ptz_down:
  alias: Camera - PTZ pulse down
  icon: mdi:arrow-down-bold
  mode: single
