# =============================================================================
#  Les trois capteurs dont dépend l'armement de la caméra
# =============================================================================
#  À poser comme paquet Home Assistant (dossier `packages/`) : la clé
#  `template:` ci-dessous se fusionne avec celle qui existe déjà.
#  Entités génériques : voir le tableau « À adapter » du README.
#
#  ⚠️ Pour AJOUTER une entité à un bloc `- binary_sensor:` existant, écrire un
#  `- name:` dans la liste déjà là. Recréer la clé `- binary_sensor:` un cran
#  plus bas l'imbrique dans la première : `check_config` répond alors
#  « 'binary_sensor' is an invalid option for 'template' » et TOUT le bloc
#  refuse de se charger, garde-fou de la caméra compris.
# =============================================================================
template:
  - binary_sensor:
      # ---- Présence mesurable -----------------------------------------------
      # « Home Assistant est-il seulement CAPABLE de savoir qui est là ? »
      # Pour répondre « personne n'est là » (la seule réponse qui arme), il
      # faut être sûr de CHAQUE personne : une seule `unknown` invalide la
      # réponse. Répondre « quelqu'un est là » ne demanderait qu'un `home` :
      # c'est cette asymétrie qui impose le `and`.
      # Dernière condition : au démarrage de HA, un traqueur routeur peut
      # publier `not_home` AVEC `in_zones: [zone.home]`. L'entité `person` fait
      # passer ce traqueur avant le GPS, et la personne paraît absente alors
      # qu'elle est là. Tant que la contradiction dure, on ne sait pas.
      - name: "Presence mesurable"
        unique_id: camera_presence_mesurable
        device_class: connectivity
        icon: mdi:account-question
        state: >-
          {{ states('person.personne_a') in ['home', 'not_home']
             and states('person.personne_b') in ['home', 'not_home']
             and not (is_state('device_tracker.telephone_a_routeur', 'not_home')
                      and (state_attr('device_tracker.telephone_a_routeur', 'in_zones') or []) | count > 0)
             and not (is_state('device_tracker.telephone_b_routeur', 'not_home')
                      and (state_attr('device_tracker.telephone_b_routeur', 'in_zones') or []) | count > 0) }}
        attributes:
          # Repris tel quel dans le message « présence aveugle ».
          detail: >-
            personne_a={{ states('person.personne_a') }} ·
            personne_b={{ states('person.personne_b') }} ·
            routeur: a={{ states('device_tracker.telephone_a_routeur') }},
            b={{ states('device_tracker.telephone_b_routeur') }}

      # ---- Logement vide selon le routeur -------------------------------------
      # Aucun des téléphones n'est vu par le routeur. Il sert au « filet » :
      # Home Assistant ne croit un traqueur routeur que lorsqu'il dit `home` ;
      # sinon il retombe sur le GPS, qui peut être vieux de plusieurs heures.
      # Un GPS périmé bat alors un routeur juste.
      # On ne retire PAS le GPS des personnes pour autant : il protège des
      # coupures du Wi-Fi, qui feraient armer la caméra sur un occupant.
      - name: "Logement vide selon le routeur"
        unique_id: camera_logement_vide_selon_le_routeur
        icon: mdi:home-export-outline
        state: >-
          {{ not (is_state('device_tracker.telephone_a_routeur', 'home')
                  or is_state('device_tracker.telephone_b_routeur', 'home')) }}
        attributes:
          # L'âge de chaque GPS, en minutes : c'est lui qui explique un écart.
          detail: >-
            routeur a={{ states('device_tracker.telephone_a_routeur') }} ·
            routeur b={{ states('device_tracker.telephone_b_routeur') }} ·
            GPS a={{ states('device_tracker.telephone_a_gps') }}
            ({{ ((now() - states.device_tracker.telephone_a_gps.last_updated).total_seconds() / 60) | round(0) }} min) ·
            GPS b={{ states('device_tracker.telephone_b_gps') }}
            ({{ ((now() - states.device_tracker.telephone_b_gps.last_updated).total_seconds() / 60) | round(0) }} min)

  # ---- Dernière ouverture de la porte ---------------------------------------
  # La PREUVE DE DÉPART du filet : on ne quitte pas le logement sans ouvrir la
  # porte. Capteur à déclencheur : il GARDE sa valeur au redémarrage, alors que
  # le `last_changed` de la porte est remis à l'heure du démarrage (il ferait
  # croire à une ouverture).
  - trigger:
      - trigger: state
        entity_id: binary_sensor.porte_entree
        to: "on"
    sensor:
      - name: "Derniere ouverture porte"
        unique_id: camera_derniere_ouverture_porte
        device_class: timestamp
        icon: mdi:door-open
        state: "{{ now().isoformat() }}"
